```html
<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Разгрузи голову — голос</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      text-align: center;
      background: #f7f7f7;
    }

    button {
      font-size: 20px;
      padding: 15px 25px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #111;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
    }

    #status {
      margin-top: 25px;
      padding: 20px;
      background: white;
      border-radius: 15px;
      text-align: left;
      white-space: pre-line;
      line-height: 1.6;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 15px;
      font-size: 20px;
      text-align: left;
    }

  </style>

</head>


<body>

  <h1>🎙️ Голосовой ввод</h1>

  <button id="record">
    🎙️ Говорить
  </button>

  <div id="status">
    Страница загружена.
  </div>

  <div id="result">
    Здесь появится текст.
  </div>


  <script>

    var APP_URL =
      'https://script.google.com/macros/s/AKfycbxFlglFpuvnqtl7HBaKP7vgrqLrQwApOlG5VrCSKdVdEhIyKeoCFl5DHyxY3BJYQuRQ/exec';


    var recordButton =
      document.getElementById('record');

    var statusEl =
      document.getElementById('status');

    var resultEl =
      document.getElementById('result');


    function log(text) {

      statusEl.textContent +=
        '\n' + text;

    }


    var SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

      log(
        '❌ Этот браузер не поддерживает распознавание речи.'
      );

      recordButton.disabled = true;

    } else {

      log(
        '✅ Распознавание речи доступно.'
      );

    }


    recordButton.onclick =
      function() {

        if (!SpeechRecognition) {
          return;
        }


        var recognition =
          new SpeechRecognition();


        recognition.lang =
          'ru-RU';


        recognition.continuous =
          false;


        recognition.interimResults =
          false;


        recordButton.disabled =
          true;


        log(
          '🎙️ Слушаю...'
        );


        recognition.onresult =
          function(event) {

            var text =
              event
                .results[0][0]
                .transcript;


            resultEl.textContent =
              text;


            log(
              '✅ Речь распознана.'
            );


            /*
             * Передаём распознанный текст
             * в основное приложение.
             */

            log(
              '⏳ Передаём текст в «Разгрузи голову»...'
            );


            setTimeout(
              function() {

                window.location.href =
                  APP_URL +
                  '?voice=' +
                  encodeURIComponent(text);

              },
              1000
            );

          };


        recognition.onerror =
          function(event) {

            log(
              '❌ Ошибка: ' +
              event.error
            );

            recordButton.disabled =
              false;

          };


        recognition.onend =
          function() {

            recordButton.disabled =
              false;

          };


        recognition.start();

      };

  </script>

</body>

</html>
```
