<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Разгрузи голову — голос</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      font-family:
        Arial,
        sans-serif;

      background: #f5f3ef;

      color: #222;
    }

    .card {
      width: min(90%, 420px);

      padding: 32px;

      text-align: center;

      background: white;

      border-radius: 24px;

      box-shadow:
        0 12px 40px
        rgba(0, 0, 0, .08);
    }

    h1 {
      margin-top: 0;
      font-size: 32px;
    }

    button {
      width: 90px;
      height: 90px;

      border: none;

      border-radius: 50%;

      font-size: 36px;

      cursor: pointer;

      background: #222;

      color: white;
    }

    button.recording {
      background: #c62828;
    }

    button:disabled {
      opacity: .6;

      cursor: default;
    }

    #status {
      margin-top: 24px;

      min-height: 24px;

      color: #666;

      line-height: 1.5;
    }

  </style>

</head>


<body>

  <div class="card">

    <h1>🎙️</h1>

    <p>
      Голосовой ввод
    </p>

    <button id="voice">
      🎙️
    </button>

    <div id="status">
      Нажми и говори
    </div>

  </div>


  <script>

    /*************************************************
     * APPS SCRIPT URL
     *************************************************/

    var APPS_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbxFlglFpuvnqtl7HBaKP7vgrqLrQwApOlG5VrCSKdVdEhIyKeoCFl5DHyxY3BJYQuRQ/exec';


    /*************************************************
     * ELEMENTS
     *************************************************/

    var voice =
      document.getElementById(
        'voice'
      );

    var status =
      document.getElementById(
        'status'
      );


    /*************************************************
     * STATE
     *************************************************/

    var recorder = null;

    var stream = null;

    var chunks = [];

    var recording = false;


    /*************************************************
     * BUTTON
     *************************************************/

    voice.addEventListener(
      'click',
      function() {

        if (recording) {

          stopRecording();

        } else {

          startRecording();

        }

      }
    );


    /*************************************************
     * START RECORDING
     *************************************************/

    function startRecording() {

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        status.textContent =
          'Браузер не поддерживает запись с микрофона.';

        return;

      }


      navigator.mediaDevices
        .getUserMedia({
          audio: true
        })

        .then(
          function(receivedStream) {

            stream =
              receivedStream;

            chunks = [];


            var mimeType =
              '';


            if (
              MediaRecorder
                .isTypeSupported(
                  'audio/webm;codecs=opus'
                )
            ) {

              mimeType =
                'audio/webm;codecs=opus';

            } else if (
              MediaRecorder
                .isTypeSupported(
                  'audio/webm'
                )
            ) {

              mimeType =
                'audio/webm';

            }


            if (mimeType) {

              recorder =
                new MediaRecorder(
                  stream,
                  {
                    mimeType:
                      mimeType
                  }
                );

            } else {

              recorder =
                new MediaRecorder(
                  stream
                );

            }


            recorder.ondataavailable =
              function(event) {

                if (
                  event.data &&
                  event.data.size > 0
                ) {

                  chunks.push(
                    event.data
                  );

                }

              };


            recorder.onstop =
              function() {

                stream
                  .getTracks()
                  .forEach(
                    function(track) {
                      track.stop();
                    }
                  );


                var audioBlob =
                  new Blob(
                    chunks,
                    {
                      type:
                        recorder.mimeType ||
                        'audio/webm'
                    }
                  );


                sendAudio(
                  audioBlob
                );

              };


            recorder.start();

            recording = true;

            voice.classList.add(
              'recording'
            );

            voice.textContent =
              '⏹️';

            status.textContent =
              'Говори — я слушаю…';

          }
        )

        .catch(
          function(error) {

            recording = false;

            voice.classList.remove(
              'recording'
            );

            voice.textContent =
              '🎙️';

            status.textContent =
              'Ошибка микрофона: ' +
              error.name;

            console.error(
              'Microphone error:',
              error
            );

          }
        );

    }


    /*************************************************
     * STOP RECORDING
     *************************************************/

    function stopRecording() {

      if (
        !recorder ||
        recorder.state === 'inactive'
      ) {

        return;

      }


      recording = false;

      voice.classList.remove(
        'recording'
      );

      voice.textContent =
        '⏳';

      voice.disabled = true;

      status.textContent =
        'Отправляю запись…';


      recorder.stop();

    }


    /*************************************************
     * SEND AUDIO
     *************************************************/

    function sendAudio(
      audioBlob
    ) {

      var reader =
        new FileReader();


      reader.onloadend =
        function() {

          var dataUrl =
            reader.result;


          var base64Audio =
            dataUrl.split(',')[1];


          var token =
            Date.now().toString() +
            '_' +
            Math.random()
              .toString(36)
              .substring(2);


          status.textContent =
            'Распознаю речь…';


          var formData =
            new URLSearchParams();


          formData.append(
            'token',
            token
          );

          formData.append(
            'audio',
            base64Audio
          );

          formData.append(
            'mimeType',
            audioBlob.type ||
            'audio/webm'
          );


          fetch(
            APPS_SCRIPT_URL,
            {
              method: 'POST',

              mode: 'no-cors',

              body: formData
            }
          )

          .then(
            function() {

              waitForResult(
                token
              );

            }
          )

          .catch(
            function(error) {

              finishWithError(
                'Не удалось отправить запись.'
              );

              console.error(
                error
              );

            }
          );

        };


      reader.readAsDataURL(
        audioBlob
      );

    }


    /*************************************************
     * WAIT FOR RESULT
     *************************************************/

    function waitForResult(
      token
    ) {

      var callbackName =
        'voiceCallback_' +
        Date.now();


      window[
        callbackName
      ] = function(result) {

        try {

          if (
            result.status ===
            'done'
          ) {

            if (
              result.text
            ) {

              status.textContent =
                'Готово: ' +
                result.text;

              /*
               * Пока просто показываем текст.
               * На следующем шаге подключим
               * автоматическую передачу текста
               * обратно в «Разгрузи голову».
               */

            } else {

              status.textContent =
                'Речь не распознана.';

            }


            resetButton();

            return;

          }


          if (
            result.status ===
            'error'
          ) {

            finishWithError(
              result.message ||
              'Ошибка распознавания.'
            );

            return;

          }


          setTimeout(
            function() {

              checkResult(
                token,
                callbackName
              );

            },
            1000
          );

        } catch (error) {

          finishWithError(
            'Ошибка обработки результата.'
          );

          console.error(
            error
          );

        }

      };


      checkResult(
        token,
        callbackName
      );

    }


    /*************************************************
     * CHECK RESULT
     *************************************************/

    function checkResult(
      token,
      callbackName
    ) {

      var script =
        document.createElement(
          'script'
        );


      script.src =
        APPS_SCRIPT_URL +
        '?action=poll' +
        '&token=' +
        encodeURIComponent(
          token
        ) +
        '&callback=' +
        encodeURIComponent(
          callbackName
        );


      script.onerror =
        function() {

          setTimeout(
            function() {

              checkResult(
                token,
                callbackName
              );

            },
            1500
          );

        };


      document.body.appendChild(
        script
      );

    }


    /*************************************************
     * RESET
     *************************************************/

    function resetButton() {

      voice.disabled =
        false;

      voice.textContent =
        '🎙️';

      recording =
        false;

    }


    /*************************************************
     * ERROR
     *************************************************/

    function finishWithError(
      message
    ) {

      resetButton();

      status.textContent =
        message;

    }

  </script>

</body>

</html>
