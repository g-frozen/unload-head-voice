  <title>Разгрузи голову — голос</title>

    html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

body {
  background: #f7f7f5;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}

.voice-card {
  width: 320px;
  min-height: 360px;
  box-sizing: border-box;
  background: white;
  border-radius: 28px;
  padding: 36px 28px;
  text-align: center;
  box-shadow: 0 15px 45px rgba(0,0,0,0.12);
}

.voice-icon {
  font-size: 56px;
  margin-bottom: 18px;
}

.voice-card h1 {
  margin: 0 0 16px;
  font-size: 28px;
  color: #222;
}

#status {
  min-height: 48px;
  color: #777;
  font-size: 15px;
  line-height: 1.5;
  margin-bottom: 28px;
}

#record {
  border: none;
  border-radius: 18px;
  padding: 15px 28px;
  font-size: 16px;
  cursor: pointer;
  background: #222;
  color: white;
}

#result {
  margin-top: 24px;
  color: #222;
  font-size: 16px;
  line-height: 1.5;
}

  </style>

</head>


<body>

  <div class="voice-card">

  <div class="voice-icon">
    🎙️
  </div>

  <h1>Говорите</h1>

  <div id="status">
    Нажмите кнопку и скажите, что у вас в голове
  </div>

  <button id="record">
    🎙️ Начать
  </button>

  <div id="result"></div>

</div>


  <script>

    var APP_URL =
      'https://script.google.com/macros/s/AKfycbxFlglFpuvnqtl7HBaKP7vgrqLrQwApOlG5VrCSKdVdEhIyKeoCFl5DHyxY3BJYQuRQ/exec';


    var recordButton =
      document.getElementById('record');

    var statusEl =
      document.getElementById('status');

    var resultEl =
      document.getElementById('result');


    function log(text) {

      statusEl.textContent +=
        '\n' + text;

    }


    var SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

      log(
        '❌ Этот браузер не поддерживает распознавание речи.'
      );

      recordButton.disabled = true;

    } else {

      log(
        '✅ Распознавание речи доступно.'
      );

    }


    recordButton.onclick =
      function() {

        if (!SpeechRecognition) {
          return;
        }


        var recognition =
          new SpeechRecognition();


        recognition.lang =
          'ru-RU';


        recognition.continuous =
          false;


        recognition.interimResults =
          false;


        recordButton.disabled =
          true;


        log(
          '🎙️ Слушаю...'
        );


        recognition.onresult =
          function(event) {

            var text =
              event
                .results[0][0]
                .transcript;


            resultEl.textContent =
              text;


            log(
              '✅ Речь распознана.'
            );


            /*
             * Передаём распознанный текст
             * в основное приложение.
             */

            log(
              '⏳ Передаём текст в «Разгрузи голову»...'
            );


            setTimeout(
              function() {

if (window.opener) {

  window.opener.postMessage(
    {
      type: 'voiceResult',
      text: text
    },
    '*'
  );

  window.close();

} else {

  window.location.href =
    APP_URL +
    '?voice=' +
    encodeURIComponent(text);

}



              },
              1000
            );

          };


        recognition.onerror =
          function(event) {

            log(
              '❌ Ошибка: ' +
              event.error
            );

            recordButton.disabled =
              false;

          };


        recognition.onend =
          function() {

            recordButton.disabled =
              false;

          };


        recognition.start();

      };

  </script>

</body>

</html>
