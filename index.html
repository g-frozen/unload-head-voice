<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Разгрузи голову — голос</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      text-align: center;
    }

    button {
      font-size: 20px;
      padding: 15px 25px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }

    #status {
      margin-top: 25px;
      white-space: pre-line;
      font-size: 18px;
      text-align: left;
    }
  </style>
</head>

<body>

  <h1>🎙️ Голосовой ввод</h1>

  <button id="record">
    🎙️ Начать запись
  </button>

  <div id="status">
    Страница загружена.
  </div>

  <script>

    var APPS_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbxFlglFpuvnqtl7HBaKP7vgrqLrQwApOlG5VrCSKdVdEhIyKeoCFl5DHyxY3BJYQuRQ/exec';

    var statusEl =
      document.getElementById('status');

    var recordButton =
      document.getElementById('record');

    function log(text) {

      statusEl.textContent +=
        '\n' + text;

    }

    function blobToBase64(blob) {

      return new Promise(function(resolve, reject) {

        var reader =
          new FileReader();

        reader.onloadend =
          function() {

            var result =
              reader.result;

            var base64 =
              result.split(',')[1];

            resolve(base64);

          };

        reader.onerror =
          reject;

        reader.readAsDataURL(blob);

      });

    }

    recordButton.onclick =
      async function() {

        try {

          log(
            'Шаг 1: кнопка нажата.'
          );

          log(
            'Шаг 2: запрашиваем микрофон...'
          );

          var stream =
            await navigator.mediaDevices
              .getUserMedia({
                audio: true
              });

          log(
            'Шаг 3: микрофон разрешён.'
          );

          var recorder =
            new MediaRecorder(stream);

          var chunks = [];

          recorder.ondataavailable =
            function(event) {

              if (
                event.data &&
                event.data.size > 0
              ) {

                chunks.push(
                  event.data
                );

              }

            };

          recorder.onstart =
            function() {

              log(
                'Шаг 4: запись началась.'
              );

            };

          recorder.onstop =
            async function() {

              log(
                'Шаг 5: запись остановлена.'
              );

              stream
                .getTracks()
                .forEach(function(track) {
                  track.stop();
                });

              try {

                var audioBlob =
                  new Blob(
                    chunks,
                    {
                      type:
                        recorder.mimeType ||
                        'audio/webm'
                    }
                  );

                log(
                  'Шаг 6: аудио создано. Размер: ' +
                  audioBlob.size +
                  ' байт.'
                );

                var base64 =
                  await blobToBase64(
                    audioBlob
                  );

                log(
                  'Шаг 7: аудио преобразовано.'
                );

                var token =
                  Date.now().toString() +
                  '_' +
                  Math.random()
                    .toString(36)
                    .substring(2);

                var formData =
                  new FormData();

                formData.append(
                  'token',
                  token
                );

                formData.append(
                  'audio',
                  base64
                );

                formData.append(
                  'mimeType',
                  audioBlob.type ||
                  'audio/webm'
                );

                log(
                  'Шаг 8: отправляем аудио в Apps Script...'
                );

                await fetch(
                  APPS_SCRIPT_URL,
                  {
                    method: 'POST',
                    mode: 'no-cors',
                    body: formData
                  }
                );

                log(
                  'Шаг 9: запрос отправлен.'
                );

              } catch (error) {

                log(
                  'ОШИБКА ОТПРАВКИ: ' +
                  error.name +
                  ' — ' +
                  error.message
                );

              }

            };

          recorder.start();

          setTimeout(function() {

            if (
              recorder.state ===
              'recording'
            ) {

              recorder.stop();

            }

          }, 3000);

        } catch (error) {

          log(
            'ОШИБКА: ' +
            error.name +
            ' — ' +
            error.message
          );

        }

      };

  </script>

</body>

</html>
