<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Разгрузи голову — голос</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      text-align: center;
    }

    button {
      font-size: 20px;
      padding: 15px 25px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }

    #status {
      margin-top: 25px;
      white-space: pre-line;
      font-size: 18px;
      text-align: left;
    }
  </style>
</head>

<body>

  <h1>🎙️ Голосовой ввод</h1>

  <button id="record">
    🎙️ Начать запись
  </button>

  <div id="status">
    Страница загружена.
  </div>

  <script>

    var statusEl =
      document.getElementById('status');

    var recordButton =
      document.getElementById('record');

    function log(text) {

      statusEl.textContent +=
        '\n' + text;

    }

    recordButton.onclick = async function() {

      try {

        log('Шаг 1: кнопка нажата.');

        log('Шаг 2: запрашиваем микрофон...');

        var stream =
          await navigator.mediaDevices
            .getUserMedia({
              audio: true
            });

        log('Шаг 3: микрофон разрешён.');

        var recorder =
          new MediaRecorder(stream);

        var chunks = [];

        recorder.ondataavailable =
          function(event) {

            if (event.data.size > 0) {
              chunks.push(event.data);
            }

          };

        recorder.onstart =
          function() {

            log(
              'Шаг 4: запись началась.'
            );

          };

        recorder.onstop =
          function() {

            log(
              'Шаг 5: запись остановлена.'
            );

            stream
              .getTracks()
              .forEach(function(track) {
                track.stop();
              });

          };

        recorder.start();

        setTimeout(function() {

          if (
            recorder.state ===
            'recording'
          ) {

            recorder.stop();

          }

        }, 3000);

      } catch (error) {

        log(
          'ОШИБКА: ' +
          error.name +
          ' — ' +
          error.message
        );

      }

    };

  </script>

</body>
</html>
