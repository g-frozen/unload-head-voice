<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Разгрузи голову — голос</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        Arial,
        sans-serif;

      background:
        #f5f3ef;

      color: #222;
    }

    .card {
      width: min(
        90%,
        420px
      );

      padding: 32px;

      text-align: center;

      background: white;

      border-radius: 24px;

      box-shadow:
        0 12px 40px
        rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    button {
      width: 90px;
      height: 90px;

      border: none;

      border-radius: 50%;

      font-size: 36px;

      cursor: pointer;

      background: #222;

      color: white;
    }

    button.recording {
      background: #c62828;
    }

    #status {
      margin-top: 24px;

      min-height: 24px;

      color: #666;
    }

  </style>

</head>


<body>

  <div class="card">

    <h1>🎙️</h1>

    <p>
      Голосовой ввод
    </p>

    <button id="voice">
      🎙️
    </button>

    <div id="status">
      Нажми и говори
    </div>

  </div>


  <script>

    var voice =
      document.getElementById(
        'voice'
      );

    var status =
      document.getElementById(
        'status'
      );


    var recorder = null;

    var chunks = [];

    var recording = false;


    voice.addEventListener(
      'click',
      function() {

        if (recording) {

          stopRecording();

        } else {

          startRecording();

        }

      }
    );


    function startRecording() {

      navigator.mediaDevices
        .getUserMedia({
          audio: true
        })

        .then(
          function(stream) {

            chunks = [];

            recorder =
              new MediaRecorder(
                stream
              );


            recorder.ondataavailable =
              function(event) {

                if (
                  event.data.size > 0
                ) {

                  chunks.push(
                    event.data
                  );

                }

              };


            recorder.onstop =
              function() {

                stream
                  .getTracks()
                  .forEach(
                    function(track) {
                      track.stop();
                    }
                  );

                status.textContent =
                  'Запись завершена.';

              };


            recorder.start();

            recording = true;

            voice.classList.add(
              'recording'
            );

            voice.textContent =
              '⏹️';

            status.textContent =
              'Говори — я слушаю…';

          }
        )

        .catch(
          function(error) {

            console.error(
              error
            );

            status.textContent =
              error.name +
              ': ' +
              error.message;

          }
        );

    }


    function stopRecording() {

      if (
        !recorder
      ) {
        return;
      }

      recorder.stop();

      recording = false;

      voice.classList.remove(
        'recording'
      );

      voice.textContent =
        '🎙️';

    }

  </script>

</body>

</html>
